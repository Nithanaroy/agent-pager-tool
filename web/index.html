<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pager">
  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="/manifest.json">
  <title>Agent Pager</title>
  <style>
    body { font: 16px -apple-system, system-ui, sans-serif; background: #111; color: #eee;
           margin: 0; padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); }
    h1 { font-size: 22px; }
    button, .btn { display: inline-block; font-size: 17px; padding: 12px 18px; border-radius: 10px; border: 0;
             background: #2f7cf6; color: #fff; margin: 6px 6px 6px 0; text-decoration: none; }
    [hidden] { display: none !important; }
    #status { color: #aaa; min-height: 1.4em; }
    #msg { background: #1b1b1b; border-left: 4px solid #2f7cf6; border-radius: 8px; padding: 12px 16px; margin: 12px 0 20px; }
    #msgTitle { font-size: 20px; margin: 4px 0; }
    #msgTime { color: #888; font-size: 13px; margin: 0 0 10px; }
    #msgBody { white-space: pre-wrap; word-break: break-word; font: 14px ui-monospace, monospace; line-height: 1.45; }
    textarea { width: 100%; height: 120px; background: #222; color: #9f9; border: 1px solid #333;
               border-radius: 8px; font: 12px ui-monospace, monospace; padding: 8px; box-sizing: border-box; }
    details { color: #aaa; margin-top: 16px; }
    #inbox { list-style: none; padding: 0; margin: 0; }
    #inbox li { padding: 10px 12px; border-bottom: 1px solid #2a2a2a; cursor: pointer; }
    #build { color: #555; font-size: 12px; margin-top: 24px; }
  </style>
</head>
<body>
  <h1>Agent Pager</h1>
  <section id="msg" hidden>
    <h2 id="msgTitle"></h2>
    <p id="msgTime"></p>
    <div id="msgBody"></div>
    <a id="msgLink" class="btn" target="_blank" rel="noopener noreferrer" hidden>Open link</a>
    <button id="msgCopy">Copy message</button>
  </section>
  <p id="status">Loading...</p>
  <button id="enable" hidden>Allow notifications</button>
  <section id="inboxBox" hidden>
    <h3>Recent</h3>
    <ul id="inbox"></ul>
  </section>
  <details id="tokenBox" hidden>
    <summary>Device token</summary>
    <p>Send this to your Mac and run <code>notify.py register &lt;token&gt;</code>:</p>
    <textarea id="token" readonly></textarea>
    <button id="copy">Copy</button>
    <button id="share">Share</button>
  </details>
  <p id="build">build 2026-09-27</p>
  <script type="module" src="/app.js"></script>
</body>
</html>
